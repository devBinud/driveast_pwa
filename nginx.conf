server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;

    # PWA service worker / manifest must always be revalidated, never cached long,
    # otherwise installed clients can get stuck on a stale app version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints these filenames on every build, so they're safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback -- react-router handles routing client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
